name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.driver }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        driver: [sqlite, mysql, pgsql]
        exclude:
          # Laravel 13 requires PHP 8.3+
          - laravel: '13.*'
            php: '8.2'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: laravel_backfill_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laravel_backfill_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcntl and posix are required: the chaos test forks and sends the
          # child a real SIGKILL rather than simulating a crash.
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, pcntl, posix
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          BACKFILL_DRIVER: ${{ matrix.driver }}
          BACKFILL_MYSQL_HOST: 127.0.0.1
          BACKFILL_MYSQL_PORT: '3306'
          BACKFILL_MYSQL_USERNAME: root
          BACKFILL_MYSQL_PASSWORD: ''
          BACKFILL_PGSQL_HOST: 127.0.0.1
          BACKFILL_PGSQL_PORT: '5432'
          BACKFILL_PGSQL_USERNAME: postgres
          BACKFILL_PGSQL_PASSWORD: postgres
        run: vendor/bin/pest
