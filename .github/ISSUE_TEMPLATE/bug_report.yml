name: Bug report
description: Something does not work the way the docs say it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The backfill class, the command you ran, and anything unusual about the table. A failing test is ideal.
      render: php
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of backfill:status
      description: "`php artisan backfill:status <name>`, if the run got that far."
      render: text

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: v1.1.0
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel and PHP versions
      placeholder: Laravel 12.x, PHP 8.4
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MySQL
        - MariaDB
        - PostgreSQL
        - SQLite
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How was it run?
      options:
        - backfill:run in a terminal
        - backfill:run --queue
        - The dashboard
        - The operator panel
        - From application code
